evb:
  host: "192.168.2.123"
  port: 5000
  timeout: 2.0

motion:
  hall_threshold: 1500
  poll_interval: 0.05
  stale_timeout: 1.5
  evb_backoff_initial: 0.2
  evb_backoff_max: 2.0
  evb_backoff_factor: 1.5
  use_bundle: true
  use_power: true
  use_imu: true
  winch_ids: [1, 2, 3, 4]
  serial_port: "/dev/ttyUSB0"
  baud_rate: 9600
  serial_timeout: 0.25
  nonblocking_command_gap: 0.06
  manual_command_gap: 0.06
  manual_first_command_wait_response: true
  all_winch_wait_response_debug: false
  setup_all_run_test_wait_response: false
  log_modbus_frames: true
  device_address: 1

web:
  host: "0.0.0.0"
  port: 8080

imu_json:
  host: "192.168.2.123"
  port: 5000
  timeout: 5.0
